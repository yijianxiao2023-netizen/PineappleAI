<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pineapple AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍍</text></svg>">
<style>
  :root {
    --bg: #fffbf2;
    --panel: #ffffff;
    --ink: #2b2a26;
    --muted: #8a8577;
    --line: #efe6d2;
    --gold: #f5b628;
    --gold-dark: #d9940c;
    --leaf: #3a9d4f;
    --user: #fff1c7;
    --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1916;
      --panel: #24231f;
      --ink: #f1ede3;
      --muted: #9c968a;
      --line: #35332d;
      --user: #3d3420;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }

  #loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    transition: opacity .5s ease;
  }
  #loader.fade { opacity: 0; pointer-events: none; }
  .pine-big { width: 84px; height: 104px; animation: bob 1.6s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
  .brand { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .bar { width: min(320px, 80vw); height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold), var(--leaf)); border-radius: 99px; transition: width .3s ease; }
  .load-text { color: var(--muted); font-size: 14px; min-height: 1.5em; }
  .load-hint { color: var(--muted); font-size: 13px; max-width: 340px; }
  .load-error { max-width: 420px; color: var(--ink); }
  .load-error button { margin-top: 14px; }

  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(8px);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .logo svg { width: 24px; height: 30px; }
  .ghost {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 7px 14px; border-radius: 99px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .ghost:hover { border-color: var(--gold); }

  #scroll { flex: 1; overflow-y: auto; }
  #messages { max-width: 760px; margin: 0 auto; padding: 24px 18px 12px; display: flex; flex-direction: column; gap: 18px; }

  #empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 12vh; gap: 10px; }
  #empty svg { width: 56px; height: 70px; }
  #empty h1 { font-size: 26px; margin: 6px 0 4px; letter-spacing: -.02em; }
  #empty p { color: var(--muted); margin: 0 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 560px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 9px 14px; border-radius: 99px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chip:hover { border-color: var(--gold); }

  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.user .body {
    background: var(--user); padding: 10px 15px; border-radius: var(--radius) var(--radius) 6px var(--radius);
    max-width: 80%; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.assistant { flex-direction: column; gap: 8px; }
  .msg.assistant .body { max-width: 100%; word-wrap: break-word; }
  .body p { margin: 0 0 .7em; }
  .body p:last-child { margin-bottom: 0; }
  .body ul, .body ol { margin: .2em 0 .8em; padding-left: 1.4em; }
  .body h4 { margin: .8em 0 .3em; font-size: 1.05em; }
  .body code { background: var(--line); padding: 1px 6px; border-radius: 6px; font-size: .9em; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .body pre { background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; border-radius: 12px; overflow-x: auto; }
  .body pre code { background: none; padding: 0; }

  .status {
    display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
    font-size: 13px; color: var(--muted);
    border: 1px solid var(--line); background: var(--panel);
    padding: 5px 11px; border-radius: 99px;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); animation: pulse 1s ease-in-out infinite; }
  .status.done .dot { background: var(--leaf); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }

  .sources { display: flex; flex-wrap: wrap; gap: 6px; }
  .sources a {
    font-size: 12.5px; color: var(--ink); text-decoration: none;
    border: 1px solid var(--line); background: var(--panel);
    padding: 4px 10px; border-radius: 99px;
  }
  .sources a:hover { border-color: var(--gold); }

  .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }

  footer { padding: 10px 18px calc(16px + env(safe-area-inset-bottom)); }
  .composer {
    max-width: 760px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 24px; padding: 8px 8px 8px 18px;
    box-shadow: 0 4px 24px rgba(120, 90, 20, .08);
  }
  .composer:focus-within { border-color: var(--gold); }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; background: transparent; color: var(--ink);
    font: inherit; padding: 8px 0; max-height: 180px;
  }
  #send {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--gold); color: #2b2a26; display: grid; place-items: center; flex-shrink: 0;
  }
  #send:hover { background: var(--gold-dark); }
  #send:disabled { opacity: .4; cursor: default; }
  #send svg { width: 18px; height: 18px; }
  .fine { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <clipPath id="pine-clip"><ellipse cx="32" cy="54" rx="20" ry="24"/></clipPath>
    <symbol id="pine" viewBox="0 0 64 80">
      <g fill="#3a9d4f">
        <path d="M32 32 C25 22 20 14 12 9 C22 10 29 17 32 25 Z"/>
        <path d="M32 32 C39 22 44 14 52 9 C42 10 35 17 32 25 Z"/>
        <path d="M32 30 C29 18 30 9 32 1 C34 9 35 18 32 30 Z"/>
      </g>
      <ellipse cx="32" cy="54" rx="20" ry="24" fill="#f5b628"/>
      <g clip-path="url(#pine-clip)" stroke="#d9940c" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M0 34 L46 80 M4 26 L58 80 M14 24 L64 74 M26 24 L64 62 M38 24 L64 50"/>
        <path d="M64 34 L18 80 M60 26 L6 80 M50 24 L0 74 M38 24 L0 62 M26 24 L0 50"/>
      </g>
    </symbol>
  </defs>
</svg>

<div id="loader">
  <svg class="pine-big"><use href="#pine"/></svg>
  <div class="brand">Pineapple AI</div>
  <div id="load-main">
    <div class="bar"><div id="bar-fill"></div></div>
    <div class="load-text" id="load-text">Getting ripe… 0%</div>
    <div class="load-hint">The first visit takes a minute. After that it opens almost instantly.</div>
  </div>
  <div class="load-error" id="load-error" hidden></div>
</div>

<div id="app" hidden>
  <header>
    <div class="logo"><svg><use href="#pine"/></svg>Pineapple AI</div>
    <button class="ghost" id="new-chat">New chat</button>
  </header>
  <div id="scroll">
    <div id="messages">
      <div id="empty">
        <svg><use href="#pine"/></svg>
        <h1>What can I help with?</h1>
        <p>Ask me anything. I can look things up on Wikipedia.</p>
        <div class="chips">
          <button class="chip">Who was Ada Lovelace?</button>
          <button class="chip">How do black holes form?</button>
          <button class="chip">Explain recursion simply</button>
          <button class="chip">Write a haiku about pineapples</button>
        </div>
      </div>
    </div>
  </div>
  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Pineapple AI"></textarea>
      <button id="send" aria-label="Send"></button>
    </div>
    <div class="fine">Pineapple AI runs on your device and can make mistakes.</div>
  </footer>
</div>

<script type="module">
const WEBLLM_URLS = [
  "./lib/web-llm.js",
  "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.89/+esm",
  "https://esm.run/@mlc-ai/web-llm@0.2.89",
  "https://esm.sh/@mlc-ai/web-llm@0.2.89",
];
let webllm = null;

const $ = (id) => document.getElementById(id);
const MAX_SEARCHES = 3;
const HISTORY_TURNS = 8;
const SEND_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const STOP_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

let engine = null;
let busy = false;
let stopped = false;
let history = [];
let shownProgress = 0;

function systemPrompt() {
  const today = new Date().toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  return `You are Pineapple AI, a friendly, smart and helpful assistant. Today is ${today}.
Never reveal what underlying model you are, who trained you, or what company made you. If asked, say you are Pineapple AI.

You have one tool: search_wikipedia. Use it when a question needs facts you are not sure about: people, places, history, science, events, definitions, statistics. Do not search for greetings, math, coding, opinions, or creative writing.
To search, reply with ONLY this and nothing else:
<tool_call>
{"name": "search_wikipedia", "arguments": {"query": "short search terms"}}
</tool_call>
Results will come back inside <tool_response>. Then answer the user using them. If the results don't help, you may search once more with different terms, or answer from what you know and say you're not certain.
Write clear, well-organized answers. Use short paragraphs and bullet lists when helpful. /no_think`;
}

let lastProgressAt = Date.now();

function setProgress(p, text) {
  lastProgressAt = Date.now();
  shownProgress = Math.max(shownProgress, Math.min(0.99, p || 0));
  const pct = Math.round(shownProgress * 100);
  $("bar-fill").style.width = pct + "%";
  const mb = (text || "").match(/(\d+)\s*MB (fetched|loaded)/i);
  let label = `Getting ripe… ${pct}%`;
  if (mb) label += ` · ${mb[1]} MB`;
  else if (/shader|compil|gpu/i.test(text || "")) label = `Warming up… ${pct}%`;
  else if (/cache/i.test(text || "") && pct === 0) label = "Getting ripe… starting download";
  $("load-text").textContent = label;
}

function cleanError(err) {
  return esc(String(err?.message || err || "Unknown error").replace(/Qwen\S*/gi, "the model").slice(0, 300));
}

async function loadLibrary() {
  for (const url of WEBLLM_URLS) {
    try {
      return await import(url);
    } catch (e) {
      console.warn("Couldn't load WebLLM from", url, e);
    }
  }
  throw new Error("Couldn't download the AI engine. Check your internet connection or any ad/script blocker.");
}

function showLoadError(html) {
  $("load-main").hidden = true;
  const box = $("load-error");
  box.innerHTML = html;
  box.hidden = false;
  document.querySelector(".pine-big").style.animation = "none";
}

const WEIGHT_HOSTS = ["https://huggingface.co", "https://hf-mirror.com"];
const HOST_KEY = "pineapple-weight-host";

async function pickModel() {
  if (!navigator.gpu) return null;
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) return null;
  return adapter.features.has("shader-f16") ? "q4f16_1" : "q4f32_1";
}

async function reachable(url) {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch(url, { cache: "no-store", signal: ctrl.signal });
    clearTimeout(t);
    return r.ok;
  } catch {
    return false;
  }
}

async function pickWeightHost(modelId) {
  let saved = null;
  try { saved = localStorage.getItem(HOST_KEY); } catch {}
  if (saved && (!navigator.onLine || WEIGHT_HOSTS.includes(saved))) {
    if (!navigator.onLine) return saved;
    if (await reachable(`${saved}/mlc-ai/${modelId}/resolve/main/mlc-chat-config.json`)) return saved;
    if (await isCached(modelId, saved)) return saved;
  }
  for (const host of WEIGHT_HOSTS) {
    if (await reachable(`${host}/mlc-ai/${modelId}/resolve/main/mlc-chat-config.json`)) return host;
  }
  return saved || null;
}

async function isCached(modelId, host) {
  try {
    const url = `${host}/mlc-ai/${modelId}/resolve/main/mlc-chat-config.json`;
    for (const name of await caches.keys()) {
      if (await (await caches.open(name)).match(url)) return true;
    }
  } catch {}
  return false;
}

function buildAppConfig(quant, host) {
  const modelId = `Qwen3-4B-${quant}-MLC`;
  return {
    modelId,
    appConfig: {
      model_list: [{
        model: `${host}/mlc-ai/${modelId}`,
        model_id: modelId,
        model_lib: new URL(`lib/Qwen3-4B-${quant}_cs1k-webgpu.wasm`, location.href).href,
        overrides: { context_window_size: 4096 },
      }],
    },
  };
}

async function init() {
  if (location.protocol === "file:") {
    showLoadError(`<p><strong>Open this through a website, not as a file.</strong></p><p>Browsers block the AI download when the page is opened by double-clicking it. Put it on GitHub Pages, or run <code>python3 -m http.server</code> in this folder and open <code>http://localhost:8000</code>.</p>`);
    return;
  }
  const stallTimer = setInterval(() => {
    if (Date.now() - lastProgressAt > 45000) {
      $("load-text").textContent += " (still working, hang tight)";
      lastProgressAt = Date.now();
    }
  }, 5000);
  try {
    $("load-text").textContent = "Getting ripe… loading engine";
    webllm = await loadLibrary();
    const quant = await pickModel();
    if (!quant) {
      clearInterval(stallTimer);
      showLoadError(`<p><strong>Your browser can't run Pineapple AI.</strong></p><p>Pineapple AI runs right on your device and needs WebGPU. Try the latest Chrome or Edge on a computer with a working graphics chip.</p>`);
      return;
    }
    $("load-text").textContent = "Getting ripe… finding a download server";
    const host = await pickWeightHost(`Qwen3-4B-${quant}-MLC`);
    if (!host) {
      clearInterval(stallTimer);
      showLoadError(`<p><strong>Can't reach the download server.</strong></p><p>Your network seems to block the sites the AI downloads from (Hugging Face and its mirror). Try a different network, like home Wi-Fi or a phone hotspot. After one full download, Pineapple AI works offline.</p><button class="ghost" onclick="location.reload()">Try again</button>`);
      return;
    }
    const { modelId, appConfig } = buildAppConfig(quant, host);
    setProgress(0, "cache");
    engine = await webllm.CreateMLCEngine(modelId, {
      appConfig,
      initProgressCallback: (p) => setProgress(p.progress, p.text),
    });
    try { localStorage.setItem(HOST_KEY, host); } catch {}
    clearInterval(stallTimer);
    setProgress(1);
    $("bar-fill").style.width = "100%";
    $("load-text").textContent = "Ready!";
    setTimeout(openApp, 350);
  } catch (err) {
    clearInterval(stallTimer);
    console.error(err);
    try { localStorage.removeItem(HOST_KEY); } catch {}
    const msg = /fetch|network|load failed/i.test(String(err?.message || err))
      ? (navigator.onLine
          ? "A download was blocked or cut off. Your network may block Hugging Face, or an ad blocker may be interfering. Try another network or turn off blockers for this page."
          : "You're offline and the AI hasn't finished downloading yet. Connect once to finish the download, then it works offline.")
      : cleanError(err);
    showLoadError(`<p><strong>Pineapple AI couldn't start.</strong></p><p>${msg}</p><button class="ghost" onclick="location.reload()">Try again</button>`);
  }
}

function openApp() {
  $("loader").classList.add("fade");
  $("app").hidden = false;
  setTimeout(() => $("loader").remove(), 500);
  $("input").focus();
}

async function searchWikipedia(query) {
  const params = new URLSearchParams({
    action: "query",
    generator: "search",
    gsrsearch: query,
    gsrlimit: "3",
    prop: "extracts|info",
    exintro: "1",
    explaintext: "1",
    exlimit: "3",
    inprop: "url",
    format: "json",
    origin: "*",
  });
  const res = await fetch("https://en.wikipedia.org/w/api.php?" + params);
  if (!res.ok) throw new Error("Wikipedia request failed");
  const data = await res.json();
  const pages = Object.values(data?.query?.pages || {}).sort((a, b) => a.index - b.index);
  return pages.map((p) => ({
    title: p.title,
    url: p.fullurl,
    text: (p.extract || "").replace(/\s+/g, " ").trim().slice(0, 1000),
  }));
}

function stripThink(t) {
  return t.replace(/<think>[\s\S]*?(<\/think>|$)/g, "");
}

function visibleText(t) {
  t = stripThink(t);
  const i = t.indexOf("<tool_call>");
  if (i !== -1) t = t.slice(0, i);
  return t.trim();
}

function parseToolCall(t) {
  const m = stripThink(t).match(/<tool_call>\s*([\s\S]*?)\s*(<\/tool_call>|$)/);
  if (!m) return null;
  try {
    const q = JSON.parse(m[1])?.arguments?.query;
    return typeof q === "string" && q.trim() ? q.trim() : null;
  } catch {
    const q = m[1].match(/"query"\s*:\s*"([^"]+)"/);
    return q ? q[1].trim() : null;
  }
}

async function generate(messages, onText) {
  const stream = await engine.chat.completions.create({
    messages,
    stream: true,
    temperature: 0.7,
    top_p: 0.8,
    max_tokens: 1200,
    stop: ["</tool_call>"],
  });
  let full = "";
  for await (const chunk of stream) {
    full += chunk.choices?.[0]?.delta?.content || "";
    onText(full);
  }
  return full;
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function inline(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
}

function blocks(s) {
  let html = "";
  let list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const line of s.split("\n")) {
    let m;
    if ((m = line.match(/^\s*[-*•]\s+(.*)/))) {
      if (list !== "ul") { close(); html += "<ul>"; list = "ul"; }
      html += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) {
      if (list !== "ol") { close(); html += "<ol>"; list = "ol"; }
      html += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^#{1,6}\s+(.*)/))) {
      close();
      html += `<h4>${inline(m[1])}</h4>`;
    } else if (!line.trim()) {
      close();
    } else {
      close();
      html += `<p>${inline(line)}</p>`;
    }
  }
  close();
  return html;
}

function render(md) {
  return md.split("```").map((part, i) => {
    if (i % 2) return `<pre><code>${esc(part.replace(/^[^\n]*\n/, ""))}</code></pre>`;
    return blocks(esc(part));
  }).join("");
}

function scrollDown() {
  const s = $("scroll");
  s.scrollTop = s.scrollHeight;
}

function addMessage(role, text) {
  $("empty").hidden = true;
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const body = document.createElement("div");
  body.className = "body";
  if (role === "user") body.textContent = text;
  wrap.appendChild(body);
  $("messages").appendChild(wrap);
  scrollDown();
  return wrap;
}

function addStatus(wrap, query) {
  const el = document.createElement("div");
  el.className = "status";
  el.innerHTML = `<span class="dot"></span><span>Searching Wikipedia for “${esc(query)}”</span>`;
  wrap.insertBefore(el, wrap.querySelector(".body"));
  scrollDown();
  return el;
}

function addSources(wrap, sources) {
  const seen = new Set();
  const links = sources.filter((s) => s.url && s.url.startsWith("https://") && !seen.has(s.url) && seen.add(s.url));
  if (!links.length) return;
  const box = document.createElement("div");
  box.className = "sources";
  box.innerHTML = links.map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">📖 ${esc(s.title)}</a>`).join("");
  wrap.appendChild(box);
}

function setBusy(b) {
  busy = b;
  $("send").innerHTML = b ? STOP_ICON : SEND_ICON;
  $("send").setAttribute("aria-label", b ? "Stop" : "Send");
  updateSend();
}

function updateSend() {
  $("send").disabled = !busy && !$("input").value.trim();
}

function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 180) + "px";
  updateSend();
}

async function send(textOverride) {
  if (busy) {
    stopped = true;
    try { engine.interruptGenerate(); } catch {}
    return;
  }
  const text = (textOverride ?? $("input").value).trim();
  if (!text || !engine) return;
  $("input").value = "";
  autosize();
  stopped = false;
  setBusy(true);

  addMessage("user", text);
  const wrap = addMessage("assistant", "");
  const body = wrap.querySelector(".body");
  body.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';

  const convo = [
    { role: "system", content: systemPrompt() },
    ...history.slice(-HISTORY_TURNS * 2),
    { role: "user", content: text },
  ];
  const sources = [];
  let answer = "";

  try {
    for (let round = 0; ; round++) {
      const raw = await generate(convo, (full) => {
        const v = visibleText(full);
        if (v) { body.innerHTML = render(v); scrollDown(); }
      });
      if (stopped) { answer = visibleText(raw); break; }

      const query = round < MAX_SEARCHES ? parseToolCall(raw) : null;
      if (!query) { answer = visibleText(raw); break; }

      body.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      const status = addStatus(wrap, query);
      let payload;
      try {
        const results = await searchWikipedia(query);
        sources.push(...results);
        payload = results.length
          ? results.map((r, i) => `[${i + 1}] ${r.title}\n${r.text}`).join("\n\n")
          : "No Wikipedia results found.";
      } catch {
        payload = "The search failed. Answer from what you know and say you couldn't look it up.";
      }
      status.classList.add("done");
      status.lastElementChild.textContent = `Searched Wikipedia for “${query}”`;
      if (round === MAX_SEARCHES - 1) payload += "\n\nNow answer the user's question. Do not search again.";

      convo.push({ role: "assistant", content: stripThink(raw).trim() + "\n</tool_call>" });
      convo.push({ role: "user", content: `<tool_response>\n${payload}\n</tool_response>` });
    }
  } catch (err) {
    console.error(err);
    if (!answer) answer = "Sorry, something went wrong. Please try again.";
  }

  if (!answer) answer = stopped ? "*Stopped.*" : "Sorry, I couldn't come up with an answer. Try asking another way.";
  body.innerHTML = render(answer);
  addSources(wrap, sources);
  scrollDown();

  if (!stopped || answer !== "*Stopped.*") {
    history.push({ role: "user", content: text }, { role: "assistant", content: answer });
  }
  setBusy(false);
  $("input").focus();
}

function newChat() {
  if (busy) { stopped = true; try { engine.interruptGenerate(); } catch {} }
  history = [];
  document.querySelectorAll(".msg").forEach((m) => m.remove());
  $("empty").hidden = false;
  $("input").focus();
}

$("send").innerHTML = SEND_ICON;
$("send").addEventListener("click", () => send());
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    if (!busy) send();
  }
});
$("new-chat").addEventListener("click", newChat);
document.querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => send(c.textContent)));
updateSend();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Offline mode unavailable", e));
}

init();
</script>
</body>
</html>
